name: ValetTrack Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-build:
    name: Lint, Frontend Build & Packaging Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Lint Frontend Code
        run: npm run lint --prefix client

      - name: Build Frontend Production Bundle
        run: npm run build:client

      - name: Verify Release Packaging & Secret Hygiene
        run: npm run package

  database-and-integration-tests:
    name: Database Invariants, ML & Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: valettrack
          POSTGRES_PASSWORD: valettrack_dev_password
          POSTGRES_DB: valettrack_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: npm ci --prefix server

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Initialize Database Schema & TimescaleDB Hypertables
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: valettrack
          DB_PASSWORD: valettrack_dev_password
          DB_NAME: valettrack_db
        run: npm run db:init

      - name: Safe Seed Baseline Configuration
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: valettrack
          DB_PASSWORD: valettrack_dev_password
          DB_NAME: valettrack_db
        run: npm run db:seed

      - name: Verify SQL Invariants & Continuous Aggregates
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: valettrack
          DB_PASSWORD: valettrack_dev_password
          DB_NAME: valettrack_db
        run: npm run db:verify

      - name: Train HistGradientBoosting ML Occupancy Forecaster
        run: npm run ml:train

      - name: Run Backend Integration Test Suite
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: valettrack
          DB_PASSWORD: valettrack_dev_password
          DB_NAME: valettrack_db
          TELEMETRY_API_KEY: valettrack_telemetry_dev_key
        run: npm test
